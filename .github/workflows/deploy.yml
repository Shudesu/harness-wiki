name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: harness-wiki.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: harness-wiki
          NEXT_PUBLIC_SITE_URL: https://harness-wiki.pages.dev

      - run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: harness-wiki.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: harness-wiki
          NEXT_PUBLIC_SITE_URL: https://harness-wiki.pages.dev

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c40947ff58a767be74a53be79a89d68a
          command: pages deploy .vercel/output/static --project-name harness-wiki --commit-dirty=true
